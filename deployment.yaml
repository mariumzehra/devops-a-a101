apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-c-42
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-c-42
  template:
    metadata:
      labels:
        app: devops-c-42
    spec:
      containers:
        - name: devops-c-42
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            
            - containerPort: 80